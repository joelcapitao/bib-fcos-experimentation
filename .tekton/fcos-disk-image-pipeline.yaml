apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: fcos-disk-image
  labels:
    pipelines.openshift.io/runtime: generic
    pipelines.openshift.io/strategy: disk-image
spec:
  description: |
    Build Fedora CoreOS disk images for multiple architectures using
    image-builder-cli running on arch-native remote VMs. Produces one OCI
    artifact per architecture and assembles them into a multi-arch image index.

    Task flow:
      clone-repository
        └─► build-images  (image-builder)
              └─► build-image-index

    Blueprint and disk layout files are read directly from the cloned
    repository. The arch is derived from the PLATFORM parameter:
      shared/blueprint.toml     — common config (merged first)
      <artifact>/<arch>.toml    — platform + console kargs (merged second)
      disk/<arch>.yaml          — partition table

  params:
    - name: git-url
      type: string
      description: Source repository URL.

    - name: revision
      type: string
      description: Git revision (branch, tag, or SHA) to build.
      default: ""

    - name: output-image
      type: string
      description: |
        Target OCI image reference for the assembled multi-arch image index,
        e.g. quay.io/redhat-user-workloads/fcos-tenant/fcos-qemu:rawhide.
        Per-arch artifacts are pushed with a platform suffix appended.

    - name: image-expires-after
      type: string
      description: |
        Lifetime of the built images, e.g. 5d, 2w. Empty means no expiry.
        Useful for PR builds that should be cleaned up automatically.
      default: ""

    # TODO: restore matrix over build-platforms once x86_64 is validated.
    # - name: build-platforms
    #   type: array
    #   description: |
    #     List of platforms to build on. Each entry must match a platform
    #     configured in the Konflux multi-platform-controller.
    #   default:
    #     - linux/x86_64
    #     - linux/aarch64
    #     - linux/ppc64le
    #     - linux/s390x

    - name: artifact
      type: string
      description: |
        Artifact type to build. Must match a top-level directory in the
        repository (e.g. "qemu", "metal"). Controls the image type and
        the blueprint path used by the image-builder task.

    - name: source-image
      type: string
      description: |
        Fully qualified pullspec of the FCOS bootc container image to build
        the disk image from, e.g. quay.io/fedora/fedora-coreos:rawhide.

  results:
    # TODO: restore once build-images task is uncommented.
    # - name: IMAGE_URL
    #   value: $(tasks.build-images.results.IMAGE_URL)
    # - name: IMAGE_DIGEST
    #   value: $(tasks.build-images.results.IMAGE_DIGEST)
    - name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)

  workspaces:
    - name: git-auth
      optional: true

  tasks:
    - name: clone-repository
      taskRef:
        params:
          - name: name
            value: git-clone-oci-ta
          - name: bundle
            value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.1@sha256:13d49df7dc9ae301627e45f95a236011422996152f1bea46cd60217b0f057407
          - name: kind
            value: task
        resolver: bundles
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.revision)
        - name: ociStorage
          value: $(params.output-image).git
        - name: ociArtifactExpiresAfter
          value: $(params.image-expires-after)
      workspaces:
        - name: basic-auth
          workspace: git-auth

    # - name: build-images
    #   runAfter:
    #     - clone-repository
    #   taskRef:
    #     name: image-builder
    #   # TODO: restore matrix over build-platforms once x86_64 is validated.
    #   # matrix:
    #   #   params:
    #   #     - name: PLATFORM
    #   #       value:
    #   #         - $(params.build-platforms)
    #   params:
    #     - name: PLATFORM
    #       value: linux/x86_64
    #     - name: ARTIFACT
    #       value: $(params.artifact)
    #     - name: SOURCE_IMAGE
    #       value: $(params.source-image)
    #     - name: OUTPUT_IMAGE
    #       value: $(params.output-image)
    #     - name: IMAGE_APPEND_PLATFORM
    #       value: "true"
    #     - name: SOURCE_ARTIFACT
    #       value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)

  finally: []
